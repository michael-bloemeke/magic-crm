<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <!-- This app is served from michaelbloemeke.com/crm/, a public domain, so it must never be
         indexed. On Vercel this came from an X-Robots-Tag header in vercel.json; on Cloudflare it
         travels with the file instead. robots.txt also disallows /crm/. Neither is a security
         control: the real gate is the Supabase login plus RLS, which is why a stranger finding this
         page sees only a sign-in screen. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default" (dark status-bar text), not "black-translucent". Translucent draws the clock and
         battery in WHITE over the page, which was right on the old near-black theme and invisible on
         the light one. This also stops the page from running under the status bar, so --safe-top
         reports 0 and the header padding collapses to its base value on its own. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bloom CRM" />
    <meta name="theme-color" content="#eef0f3" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Bloom CRM</title>
    <!-- The Mac's two typefaces (Fraunces for titles and big numbers, Hanken Grotesk for everything
         else), loaded exactly the way the Mac app loads them. Offline, the stacks below fall back to
         Georgia and the system font, so nothing breaks without a connection. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" />
    <style>
      /* App color system (phone). Deliberately the SAME palette as the desktop's src/index.css, so
         the two apps stop looking like different products.

         One scheme, no options. This was "Indigo Nocturne" (graphite + electric indigo) while the
         desktop had six of its own; Michael, 2026-08-06: "the color scheme is abysmal... I just want
         a simple and sleek color design". Light neutral grey page, white cards, near-black text, one
         restrained blue accent, semantics dark enough to read on a light background.

         The token names are historical (--brass, --parchment) and kept on purpose: they are used in
         hundreds of places across app.js and this stylesheet. Read "brass" as "accent" and
         "parchment" as "body text". */
      :root {
        --bg: #eef0f3;           /* page */
        --surface: #ffffff;      /* cards */
        --surface2: #f5f7f9;     /* inputs / raised */
        --surface3: #eaedf1;     /* active / pressed */
        --line: rgba(15, 22, 32, 0.11);
        --line-strong: rgba(15, 22, 32, 0.18);
        --parchment: #14171b;    /* primary text */
        --muted: #545b64;
        --faint: #858d97;
        --brass: #2563eb;        /* primary accent */
        --brass-bright: #1a4fd0; /* stronger, not lighter: contrast comes from going darker here */
        --brass-dim: #a9c2f6;
        --green: #15803d;        /* money / booked / done / yes */
        --amber: #b45309;        /* pending / due today / maybe */
        --red: #dc2626;          /* overdue / danger / no */
        --teal: #0e7490;         /* secondary / info */
        --violet: #7c3aed;       /* extra category accent */
        --ink-on-accent: #ffffff; /* text on a filled accent button */
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bot: env(safe-area-inset-bottom, 0px);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      /* color-scheme tells the browser to draw NATIVE controls light. Without it they follow the
         phone's own setting, so on an iPhone in Dark Mode the date field's calendar button is drawn
         WHITE on our white input and is effectively invisible. Same for the select arrow. */
      html { color-scheme: light; }
      html, body { margin: 0; padding: 0; background: var(--bg); color: var(--parchment); }
      /* The calendar button is faint by default; give it enough presence to look like a control. */
      input[type="date"]::-webkit-calendar-picker-indicator { opacity: .55; }
      input[type="date"]:focus::-webkit-calendar-picker-indicator { opacity: 1; }
      /* Flat. The two radial glows that used to sit here were built for a near-black screen and read
         as smudges on a light one. */
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Hanken Grotesk', system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.45;
        overscroll-behavior-y: none;
      }
      button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
      a { color: var(--brass-bright); }
      .hidden { display: none !important; }

      /* App shell */
      #app { min-height: 100vh; padding-bottom: calc(80px + var(--safe-bot)); }
      header.topbar {
        position: sticky; top: 0; z-index: 10;
        padding: calc(10px + var(--safe-top)) 16px 10px;
        background: color-mix(in oklab, var(--bg) 86%, transparent);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--line);
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
      }
      .topbar h1 { font-size: 17px; margin: 0; letter-spacing: 0.2px; }
      .topbar .sub { font-size: 11px; color: var(--faint); margin-top: 1px; }
      .iconbtn { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); }
      .iconbtn:active { background: var(--surface2); }
      /* Back lives in the header's right-hand group, just left of Refresh (Michael, 2026-10-23), with
         the menu button keeping the far-left corner. It names where it goes ("Pipeline", a client's
         name), is the same height and border as the icon buttons beside it, and only appears when
         there is somewhere to go. A long destination trims with an ellipsis, and so does the page
         title, so the header always stays one line. */
      .backpill { display: inline-flex; align-items: center; gap: 2px; height: 34px; max-width: 36vw; padding: 0 10px 0 6px;
                  border-radius: 9px; border: 1px solid var(--line); color: var(--brass-bright); font-size: 14px; font-weight: 600; }
      .backpill span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .backpill svg { flex: none; }
      .backpill:active { background: var(--surface2); }
      .topbar-title h1, .topbar-title .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      main { padding: 12px 14px 20px; }
      .section-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--faint); margin: 18px 4px 8px; display: flex; align-items: center; gap: 8px; }
      .section-label:first-child { margin-top: 4px; }
      /* Section heading carrying its own action ("Tasks   + Add"). The button opts out of the
         heading's uppercase/tracking, which would otherwise make "Add" read as another label. */
      .sec-head .sec-t { flex: 1; min-width: 0; }
      .sec-head .addbtn { text-transform: none; letter-spacing: normal; margin: -6px 0; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brass); flex: none; }

      /* Cards */
      .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; margin-bottom: 9px; display: block; width: 100%; text-align: left; }
      .card:active { border-color: var(--line-strong); background: var(--surface2); }
      .card .row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
      .card .name { font-size: 15.5px; font-weight: 600; color: var(--parchment); }
      .card .fee { font-size: 13.5px; color: var(--brass-bright); font-variant-numeric: tabular-nums; flex: none; }
      .card .meta { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
      .pill { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--muted); margin-top: 7px; }
      .pill.overdue { color: var(--red); border-color: color-mix(in oklab, var(--red) 50%, var(--line)); }
      .pill.due { color: var(--brass-bright); border-color: color-mix(in oklab, var(--brass) 50%, var(--line)); }

      .search { width: 100%; padding: 10px 13px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); color: var(--parchment); font-size: 14.5px; margin-bottom: 4px; }
      .search::placeholder { color: var(--faint); }
      .empty { color: var(--faint); font-size: 13px; text-align: center; padding: 30px 10px; }

      /* Detail */
      .back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; margin-bottom: 6px; }
      .kv { display: grid; grid-template-columns: 1fr; gap: 0; }
      .kv .item { padding: 11px 0; border-bottom: 1px solid var(--line); }
      .kv .k { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--faint); }
      .kv .v { font-size: 15px; color: var(--parchment); margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
      .contact { display: flex; gap: 10px; margin-top: 8px; }
      .contact a { flex: 1; text-align: center; padding: 9px; border: 1px solid var(--line); border-radius: 10px; color: var(--brass-bright); font-size: 13.5px; text-decoration: none; }

      /* One person on a project: their card plus their own Call/Text/Email row. Repeats per contact. */
      .contactcard { cursor: default; }
      .cc-head { display: flex; align-items: flex-start; gap: 8px; }
      .cc-head .name { flex: 1; min-width: 0; }
      .cc-primary { margin-left: 8px; padding: 1px 7px; border-radius: 999px; border: 1px solid color-mix(in oklab, var(--brass) 45%, var(--line)); color: var(--brass-bright); font-size: 9.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; vertical-align: middle; }
      .cc-x { flex: none; margin: -2px -2px 0 0; padding: 4px; border-radius: 8px; color: var(--faint); }
      .cc-x:active { color: var(--red); background: var(--surface2); }
      .log { font-size: 13px; color: var(--muted); padding: 7px 0; border-bottom: 1px solid var(--line); }

      /* --- editing UI (Stage C) --- */
      /* Buttons */
      .btn-gold { background: var(--brass); color: var(--ink-on-accent); font-weight: 700; padding: 10px 14px; border-radius: 10px; font-size: 14px; }
      .btn-gold:active { filter: brightness(0.92); }
      .btn-ghost { border: 1px solid var(--line-strong); color: var(--muted); padding: 10px 14px; border-radius: 10px; font-size: 14px; background: var(--surface); }
      .btn-ghost:active { background: var(--surface2); }
      .addbtn { display: inline-flex; align-items: center; gap: 5px; color: var(--brass-bright); font-size: 13px; font-weight: 600; padding: 6px 10px; border: 1px solid color-mix(in oklab, var(--brass) 40%, var(--line)); border-radius: 999px; }
      .addbtn:active { background: var(--surface2); }
      .tabhead { display: flex; align-items: center; justify-content: space-between; margin: 4px 2px 8px; }

      /* ---- email ---- */
      .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
      .segb { padding: 6px 15px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--faint); background: none; border: 0; }
      .segb.on { background: var(--surface2); color: var(--brass-bright); }
      .mailrow { display: flex; gap: 10px; width: 100%; text-align: left; align-items: flex-start;
        padding: 12px 2px; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; }
      /* The unread dot is always in the layout, transparent when read, so a read row and an unread
         row have their text in the same place and the list does not shimmy as things are opened. */
      .maildot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: transparent; margin-top: 7px; }
      .mailrow.unread .maildot { background: var(--brass); }
      .mailbody { flex: 1; min-width: 0; display: block; }
      .mailtop { display: flex; align-items: baseline; gap: 10px; }
      .mailfrom { flex: 1; min-width: 0; font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mailrow.unread .mailfrom { color: var(--parchment); font-weight: 600; }
      .mailwhen { flex: none; font-size: 11.5px; color: var(--faint); }
      .mailto { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--faint); }
      .mailsub { display: block; font-size: 14.5px; color: var(--parchment); margin-top: 2px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mailrow.unread .mailsub { font-weight: 600; }
      .mailsnip { display: block; font-size: 12.5px; color: var(--faint); margin-top: 2px; line-height: 1.4;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .mailproj { display: inline-block; margin-top: 6px; font-size: 10.5px; font-weight: 600;
        padding: 2px 8px; border-radius: 999px; color: var(--teal);
        border: 1px solid color-mix(in oklab, var(--teal) 40%, var(--line)); }
      .msg { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 13px; margin-bottom: 10px; }
      .msg-h { display: flex; align-items: baseline; gap: 10px; }
      .msg-from { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .msg-when { flex: none; font-size: 11.5px; color: var(--faint); }
      .msg-to { font-size: 11.5px; color: var(--faint); margin-top: 2px; word-break: break-word; }
      .msg-b { font-size: 14px; line-height: 1.55; color: var(--parchment); margin-top: 9px; word-break: break-word; }

      /* ---- proposals ---- */
      .propcard { pointer-events: auto; }
      .propviews { font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }

      /* ---- the proposal, previewed inside the app ----
         A full-screen pane over everything, including the drawer and the project tab bar, because
         the whole point is that looking at a proposal does not take him out of the CRM. */
      .previewpane { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; }
      body.previewing { overflow: hidden; }
      .pv-bar { flex: none; display: flex; align-items: center; gap: 10px; padding: calc(8px + var(--safe-top)) 12px 8px;
        background: var(--surface); border-bottom: 1px solid var(--line); }
      .pv-back { flex: none; display: inline-flex; align-items: center; gap: 5px; padding: 8px 12px 8px 8px;
        border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface2);
        color: var(--parchment); font-size: 13.5px; font-weight: 600; }
      .pv-t { min-width: 0; flex: 1; }
      .pv-title { font-size: 13.5px; font-weight: 600; color: var(--parchment); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .pv-sub { font-size: 11px; color: var(--faint); }
      .pv-body { position: relative; flex: 1; min-height: 0; background: var(--surface2); }
      .pv-frame { width: 100%; height: 100%; border: 0; display: block; transition: opacity 160ms ease; }
      .pv-load { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        font-size: 12.5px; color: var(--muted); padding: 20px; text-align: center; }
      .pv-copy { flex: none; margin: 0; padding: 13px 14px calc(13px + var(--safe-bot));
        background: var(--surface); border: 0; border-top: 1px solid var(--line);
        color: var(--brass-bright); font-size: 13.5px; font-weight: 600; width: 100%; }

      /* ---- pipeline card marks ---- */
      .cdown { margin-left: 8px; padding-left: 8px; border-left: 1px solid var(--line); color: var(--faint); }
      .cdown.soon { color: var(--brass-bright); font-weight: 600; border-left-color: color-mix(in oklab, var(--brass) 40%, var(--line)); }
      .cmarks { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
      .cmark { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: 0.02em; }
      .cmark-task { color: var(--red); background: rgba(242,109,99,0.10); }
      .cmark-mail { color: var(--teal); background: rgba(93,169,163,0.12); }

      /* Add/edit forms */
      .addform { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 14px; padding: 12px; margin-bottom: 12px; }
      .addrow { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
      .addrow > * { flex: 1; }
      .field-input { width: 100%; font-size: 16px; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface2); color: var(--parchment); }
      .field-input::placeholder { color: var(--faint); }
      textarea.field-input { resize: vertical; line-height: 1.4; font-family: inherit; }
      select.field-input, .stagesel { -webkit-appearance: none; appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23a7adc0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>"); background-repeat: no-repeat; background-position: right 12px center; padding-right: 34px; }
      .stagesel { width: 100%; font-size: 15px; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line-strong); background-color: var(--surface2); color: var(--parchment); }
      .hint { font-size: 11.5px; color: var(--faint); margin-top: 6px; }
      .donehead { display: flex; align-items: center; justify-content: space-between; width: 100%;
        margin: 20px 0 8px; padding: 9px 4px; background: none; border: 0; border-top: 1px solid var(--line);
        font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--faint); }
      .donechev { font-weight: 600; letter-spacing: 0.08em; color: var(--muted); }
      .pendrow { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-top: 10px; }
      .pendrow input { width: 18px; height: 18px; }

      /* Tap-to-edit rows */
      .kv-tap { cursor: pointer; }
      .kv-tap:active { background: var(--surface2); }
      .kv .v { position: relative; }
      .edit-display { position: relative; }
      .pencil { position: absolute; top: 12px; right: 2px; color: var(--faint); font-size: 13px; }

      /* Task rows with checkbox + delete */
      .taskrow { display: flex; align-items: flex-start; gap: 11px; }
      .taskrow .taskbody { flex: 1; min-width: 0; }
      .taskrow.done .name { text-decoration: line-through; color: var(--muted); }
      .check { flex: none; width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--line-strong); display: grid; place-items: center; color: var(--ink-on-accent); margin-top: 1px; }
      .taskrow.done .check { background: var(--brass); border-color: var(--brass); }
      .taskdel { flex: none; color: var(--faint); width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; }
      .taskdel:active { background: var(--surface2); color: var(--red); }

      /* Modal sheet (bottom) */
      .sheet { position: fixed; inset: 0; z-index: 60; background: rgba(4, 6, 12, 0.55); display: flex; align-items: flex-end; }
      .sheet-card { width: 100%; background: var(--surface); border-top-left-radius: 20px; border-top-right-radius: 20px; border-top: 1px solid var(--line-strong); padding: 18px 16px calc(20px + var(--safe-bot)); animation: sheetUp 0.18s ease-out; max-height: 90vh; overflow-y: auto; }
      @keyframes sheetUp { from { transform: translateY(30px); opacity: 0.6; } to { transform: translateY(0); opacity: 1; } }
      .sheet-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
      /* A sheet with a pinned header and its own scrolling body. The plain .sheet-card scrolls as one
         piece, which on a long form pushes the title away and leaves no way out except tapping the
         sliver of backdrop above the sheet. */
      .sheet-card.sheet-tall { display: flex; flex-direction: column; max-height: 88vh; padding-top: 12px; overflow-x: hidden; }
      .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); flex: none; }
      .sheet-head .sheet-title { margin: 0; }
      /* The Home lists: as tall as the screen allows, with the way through to the full page at both
         ends of the list. */
      .sheet-card.sheet-full { height: calc(100vh - var(--safe-top) - 10px); height: calc(100dvh - var(--safe-top) - 10px); max-height: none; }
      .homesheet-go { width: 100%; margin: 2px 0 12px; }
      .homesheet-list + .homesheet-go { margin: 12px 0 2px; }
      .sheet-x { flex: none; width: 34px; height: 34px; border-radius: 999px; border: 1px solid var(--line-strong);
                 background: var(--surface2); color: var(--muted); display: flex; align-items: center; justify-content: center; }
      .sheet-x:active { background: var(--line); }
      /* Vertical only. Something a hair wider than the container (a long placeholder, a textarea's
         resize grip) let the whole panel slide sideways, which made reading down a list of fields
         unnecessarily fiddly. Nothing in here ever needs horizontal scrolling. */
      .sheet-body { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-top: 12px; }
      .sheet-body .field-input { max-width: 100%; }
      /* One always-visible field. The value is readable without tapping, which was the whole point:
         previously every value was hidden behind its own label and had to be opened to be read. */
      .fld { margin-bottom: 14px; }
      .fld-l { font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }

      /* Toast */
      #toast { position: fixed; left: 50%; bottom: calc(92px + var(--safe-bot)); transform: translateX(-50%) translateY(20px); z-index: 70; background: var(--surface2); color: var(--parchment); border: 1px solid var(--line-strong); padding: 10px 16px; border-radius: 999px; font-size: 13.5px; box-shadow: 0 8px 24px rgba(15,22,32,0.16); opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; max-width: 88vw; text-align: center; }
      #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      #toast.err { border-color: color-mix(in oklab, var(--red) 60%, var(--line)); color: var(--red); }

      /* Money */
      .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 10px; }
      .stat .big { font-size: 28px; font-weight: 700; color: var(--parchment); font-variant-numeric: tabular-nums; }
      .stat .cap { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.12em; }
      .bar { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; margin-top: 10px; }
      .bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--brass), var(--brass-bright)); }

      /* Swipe-to-reveal row. The action sits underneath and is uncovered by dragging the card left.
         touch-action: pan-y lets the browser keep vertical scrolling while we claim the horizontal
         axis, which is what stops the page fighting the finger on a diagonal drag. */
      .swipe { position: relative; overflow: hidden; border-radius: 14px; margin-bottom: 9px; }
      .swipe-act { position: absolute; inset: 0 0 0 auto; width: 104px; display: flex; }
      .swipe-btn { width: 100%; border-radius: 14px; background: var(--red); color: #fff;
                   font-size: 14px; font-weight: 600; }
      .swipe-btn:active { filter: brightness(0.92); }
      .swipe-fg { position: relative; touch-action: pan-y; will-change: transform; }
      /* The card inside a swipe row owns the spacing already handled by .swipe. */
      .swipe-fg > .card { margin-bottom: 0; }

      /* The action button inside a toast (Undo). */
      .toast-act { margin-left: 12px; padding: 2px 4px; color: var(--brass-bright); font-weight: 700;
                   font-size: 13.5px; text-decoration: underline; }

      /* An explanatory line at the top of a page (currently just Deleted's 30-day note). */
      .pagenote { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; font-size: 12.5px; line-height: 1.45; color: var(--muted); }

      /* Record status pills on cards */
      .pill.done { color: var(--green); border-color: color-mix(in oklab, var(--green) 45%, var(--line)); }
      .pill.arch { color: var(--muted); border-color: var(--line-strong); }
      .pill.del { color: var(--red); border-color: color-mix(in oklab, var(--red) 45%, var(--line)); }

      /* Floating New-project button */
      #fab { position: fixed; right: 16px; bottom: calc(24px + var(--safe-bot)); z-index: 30; width: 54px; height: 54px; border-radius: 50%; background: linear-gradient(160deg, var(--brass-bright), var(--brass)); color: var(--ink-on-accent); display: grid; place-items: center; box-shadow: 0 8px 22px rgba(15,22,32,0.20), 0 0 0 1px color-mix(in oklab, var(--brass) 60%, transparent); }
      #fab:active { filter: brightness(1.08); transform: translateY(1px); }

      /* Lifecycle actions (project detail) */
      .actions { margin: 2px 0 6px; }
      .actrow { display: flex; gap: 8px; }
      .statusline { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
      .btn-danger { width: 100%; margin-top: 8px; padding: 9px 14px; border-radius: 10px; font-size: 13px; color: var(--red); border: 1px solid color-mix(in oklab, var(--red) 30%, var(--line)); background: transparent; }
      .btn-danger:active { background: color-mix(in oklab, var(--red) 12%, transparent); }
      .payline { font-size: 12.5px; color: var(--muted); margin-top: 12px; line-height: 1.5; }

      .actstack { display: flex; flex-direction: column; gap: 9px; }
      /* A tappable row inside the Actions sheet: label left, current value right. */
      .actrow { width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-align: left; }
      .actrow:active { background: var(--surface2); }
      .actrow.on { border-color: color-mix(in oklab, var(--brass) 45%, var(--line)); }
      .actrow .ar-l { flex: 1; min-width: 0; font-size: 14.5px; font-weight: 600; color: var(--parchment); }
      .actrow .ar-v { font-size: 12.5px; color: var(--muted); }
      .actrow.on .ar-v { color: var(--brass-bright); }

      /* Project header: the block repeated at the top of every project tab. Scrolls away with the
         page by design (Michael: not a sticky nav bar), it is just always the first thing. */
      .phead { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 13px 14px; margin: 4px 0 14px; }
      .phead-top { display: flex; align-items: flex-start; gap: 10px; }
      .phead-name { flex: 1; min-width: 0; font-size: 20px; font-weight: 600; line-height: 1.25; }
      .phead-act { flex: none; margin: -4px -6px 0 0; padding: 6px 8px; border-radius: 9px; color: var(--muted); }
      .phead-act:active { background: var(--surface2); color: var(--parchment); }
      .phead-meta { color: var(--muted); font-size: 13.5px; margin-top: 4px; }
      .phead-chips { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 9px; }
      .phead-fee { font-size: 14px; font-weight: 600; color: var(--brass-bright); font-variant-numeric: tabular-nums; }
      .phead-contacts { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 11px; display: flex; flex-direction: column; gap: 12px; }
      .phead-c { min-width: 0; }
      .phead-cn { font-size: 14.5px; font-weight: 600; }
      .phead-cs { font-size: 12.5px; color: var(--muted); margin-top: 1px; word-break: break-word; }
      .phead-nc { margin-top: 11px; border-top: 1px solid var(--line); padding-top: 11px; font-size: 12.5px; color: var(--faint); }

      /* ---- the day-of card ----
         When / where / who, at a size that reads at arm's length with the phone in a car mount.
         Numbers are tabular so the three times line up as a column of times rather than as three
         unrelated strings. */
      .dayof { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; overflow: hidden; margin-bottom: 4px; }
      .do-sec { padding: 14px; border-bottom: 1px solid var(--line); }
      .do-sec:last-child { border-bottom: 0; }
      .do-l { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--faint); }
      .do-date { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
      .do-date-v { font-size: 20px; font-weight: 600; color: var(--parchment); letter-spacing: -0.01em; }
      .do-date-v.miss { color: var(--red); font-weight: 500; }
      .do-date-c { font-size: 12.5px; color: var(--muted); }
      .do-date-c.soon { color: var(--brass-bright); font-weight: 600; }
      .do-times { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
      .do-time { min-width: 0; }
      .do-time-l { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--faint); }
      .do-time-v { font-size: 17px; font-weight: 600; color: var(--parchment); margin-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      /* A value that is not a clock time: smaller, wrapping, up to three lines. Truncating "Cocktail
         hour, around 6" to "Cocktail ho..." throws away the only useful part. */
      .do-time-v.free { font-size: 13px; font-weight: 500; line-height: 1.35; white-space: normal;
        display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; text-overflow: clip; }
      .do-time-v.miss { color: var(--red); opacity: 0.7; font-weight: 500; }
      .do-vmeta { font-size: 12.5px; color: var(--muted); margin-top: 3px; line-height: 1.45;
        display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
      /* The address is a button, not a paragraph: the whole block is the tap target, because it is
         read while getting into a car and a 14px link would not be. */
      .do-addr { display: block; width: 100%; text-align: left; margin-top: 8px; padding: 0;
        font-size: 16.5px; line-height: 1.35; font-weight: 500; color: var(--brass-bright);
        background: none; border: 0; white-space: pre-wrap; word-break: break-word; }
      .do-addr.miss { color: var(--red); font-weight: 400; font-size: 14px; }
      .do-inline-addr { display: block; width: 100%; text-align: left; padding: 0; background: none;
        border: 0; color: var(--brass-bright); font-size: 15px; margin-top: 3px;
        white-space: pre-wrap; word-break: break-word; }
      .do-actions { display: flex; gap: 8px; margin-top: 11px; }
      .do-go, .do-alt { flex: 1; text-align: center; padding: 10px 6px; border-radius: 10px;
        font-size: 13.5px; font-weight: 600; text-decoration: none; display: block; }
      .do-go { background: var(--brass); color: var(--ink-on-accent); border: 1px solid var(--brass); }
      .do-alt { border: 1px solid var(--line-strong); color: var(--muted); background: var(--surface2); font-weight: 500; }
      .do-who { font-size: 17px; font-weight: 600; margin-top: 4px; }
      .do-whos { font-size: 12.5px; color: var(--muted); margin-top: 2px; word-break: break-word; }
      .do-facts { display: flex; flex-wrap: wrap; gap: 6px 22px; }
      .do-fact { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
      .do-fact-l { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--faint); flex: none; }
      .do-fact-v { font-size: 14px; color: var(--parchment); min-width: 0; word-break: break-word; }

      /* Details tab: every field, blanks included and called out. */
      .kv-full .item.miss .k { color: var(--red); }
      .kv-full .item.miss .v { color: var(--red); opacity: 0.75; font-style: italic; }
      .textblock { font-size: 14.5px; line-height: 1.5; color: var(--parchment); white-space: normal; word-break: break-word; }

      /* Bottom tab bar, shown only inside a project. Fixed to the viewport; body gets matching
         padding via .has-ptabs so the last section is never trapped underneath it. */
      #ptabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; background: color-mix(in oklab, var(--bg) 92%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line-strong); padding-bottom: var(--safe-bot); }
      .ptab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 9px 4px 7px; color: var(--faint); }
      .ptab .ptab-i { position: relative; display: block; line-height: 0; }
      .ptab svg { width: 22px; height: 22px; }
      .ptab-l { font-size: 10.5px; font-weight: 600; letter-spacing: 0.01em; }
      .ptab.on { color: var(--brass-bright); }
      .ptab:active { color: var(--muted); }
      .ptab.on:active { color: var(--brass); }
      .ptab-badge { position: absolute; top: -5px; right: -9px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--red); color: var(--ink-on-accent); font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
      /* #app already reserves 80px + safe area at the bottom (it was there for the New-project
         button), which clears the ~58px tab bar. This only tops it up so the last control on a tab
         is not sitting flush against the bar. */
      body.has-ptabs #app { padding-bottom: calc(96px + var(--safe-bot)); }

      /* Booking workflow (phase sections + email cards) */
      .bk-sec { margin-bottom: 16px; }
      .bk-head { display: flex; align-items: center; gap: 9px; margin: 0 0 9px; }
      .emailcard { width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 13px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); margin-bottom: 7px; text-align: left; }
      .emailcard:active { background: var(--surface2); }
      .emailcard:disabled { opacity: 0.55; }
      .emailcard.placeholder { border-style: dashed; }
      .ec-title { flex: 1; font-size: 14px; font-weight: 600; color: var(--parchment); }
      .emailcard:disabled .ec-title { color: var(--muted); font-weight: 500; }
      .ec-status { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; flex: none; }
      .ec-status.sent { color: var(--green); background: color-mix(in oklab, var(--green) 15%, transparent); }
      .ec-status.draft { color: var(--amber); background: color-mix(in oklab, var(--amber) 15%, transparent); }
      .ec-status.none { color: var(--faint); border: 1px solid var(--line); }
      .ec-status.muted { color: var(--faint); }

      /* Topbar title (between the menu button and the actions) */
      .topbar-title { flex: 1; min-width: 0; }
      .topbar-title h1 { font-size: 17px; margin: 0; letter-spacing: 0.2px; }

      /* Slide-out drawer navigation */
      #drawer { position: fixed; inset: 0; z-index: 40; }
      .drawer-backdrop { position: absolute; inset: 0; background: rgba(4, 6, 12, 0.55); backdrop-filter: blur(2px); animation: fadeIn 0.18s ease; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .drawer-panel { position: absolute; top: 0; bottom: 0; left: 0; width: 80%; max-width: 300px; background: var(--surface); border-right: 1px solid var(--line-strong); box-shadow: 8px 0 34px rgba(15,22,32,0.18); display: flex; flex-direction: column; padding: calc(14px + var(--safe-top)) 0 calc(12px + var(--safe-bot)); animation: drawerIn 0.2s ease-out; }
      @keyframes drawerIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }
      .drawer-brand { font-size: 18px; font-weight: 700; color: var(--brass-bright); padding: 4px 20px 14px; letter-spacing: 0.3px; border-bottom: 1px solid var(--line); }
      .drawer-nav { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
      .drawer-nav button { display: flex; align-items: center; gap: 13px; padding: 12px 14px; border-radius: 11px; color: var(--muted); font-size: 15px; font-weight: 500; text-align: left; }
      .drawer-nav button:active { background: var(--surface2); }
      .drawer-nav button svg { width: 20px; height: 20px; flex: none; }
      .drawer-nav button.on { background: var(--surface2); color: var(--brass-bright); }
      .drawer-nav button.on svg { color: var(--brass); }
      .drawer-nav .navbadge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--red); color: var(--ink-on-accent); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
      /* Plain count (how many projects live on that page). Quieter than .navbadge, which is a red alert. */
      .drawer-nav .navcount { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--faint); font-variant-numeric: tabular-nums; }
      .drawer-foot { padding: 12px 18px 0; border-top: 1px solid var(--line); }
      .drawer-foot button { display: flex; align-items: center; gap: 11px; color: var(--faint); font-size: 14px; padding: 8px 0; }
      .drawer-foot button:active { color: var(--muted); }


      /* Booking sheet (replaced the per-email workflow panel, 2026-08-03) */
      .bk-gate { border: 1px solid var(--line); background: var(--surface2); border-radius: 12px; padding: 12px 13px; margin: 4px 0 6px; }
      .bk-gate.bad { border-color: rgba(242,109,99,0.45); background: rgba(242,109,99,0.07); }
      .bk-gate-t { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--faint); margin-bottom: 8px; }
      .bk-gate.bad .bk-gate-t { color: var(--red); }
      .bk-gate .miss { color: var(--red); }
      .bk-prog { display: flex; gap: 5px; margin-top: 14px; }
      .bk-seg { flex: 1; display: flex; flex-direction: column; gap: 4px; }
      .bk-seg .bk-bar { height: 3px; border-radius: 2px; background: var(--line); display: block; }
      .bk-seg.on .bk-bar { background: var(--teal); }
      .bk-seg.done .bk-bar { background: var(--green); }
      .bk-seg .bk-lab { font-size: 10px; color: var(--faint); }
      .bk-seg.on .bk-lab, .bk-seg.done .bk-lab { color: var(--muted); }
      .bk-seg .bk-when { font-size: 9px; color: var(--faint); opacity: .75; line-height: 1.25; }

      /* The agreement, as an attachment rather than a button */
      .pdfchip { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
                 border: 1px solid var(--line); background: var(--surface2); border-radius: 12px;
                 padding: 10px 12px; margin-top: 12px; }
      .pdfchip:active { background: var(--surface3); }
      .pdfchip-i { flex: none; width: 30px; height: 30px; border-radius: 7px; display: inline-flex;
                   align-items: center; justify-content: center; font-size: 9px; font-weight: 800;
                   color: var(--green); background: rgba(70,209,137,0.16); }
      .pdfchip-n { display: block; font-size: 13.5px; font-weight: 600; color: var(--parchment); }
      .pdfchip-s { display: block; font-size: 11px; color: var(--faint); }

      /* Full-height PDF viewer */
      .pdfsheet .pdfcard { height: 92vh; display: flex; flex-direction: column; padding: 0; overflow: hidden; }
      .pdfhead { display: flex; align-items: center; justify-content: space-between; gap: 10px;
                 padding: 12px 14px; border-bottom: 1px solid var(--line); }
      .pdfframe { flex: 1; min-height: 0; width: 100%; border: 0; background: #fff; }

      /* Home dashboard */
      .greeting { font-size: 22px; font-weight: 600; margin: 6px 2px 14px; }
      .greeting .sub2 { display: block; font-size: 13px; color: var(--faint); font-weight: 400; margin-top: 3px; }
      .statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
      .statcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; text-align: left; }
      .statcard:active { background: var(--surface2); }
      .statcard .n { font-size: 23px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--parchment); }
      .statcard .l { font-size: 11.5px; color: var(--faint); margin-top: 2px; }
      /* Per-category accent (a left bar + tinted number) so each metric reads distinctly. */
      .statcard { border-left: 3px solid var(--line-strong); }
      .statcard.s-money { border-left-color: var(--green); }
      .statcard.s-money .n { color: var(--green); }
      .statcard.s-mail { border-left-color: var(--teal); }
      .statcard.s-mail .n { color: var(--teal); }
      .statcard.s-over { border-left-color: var(--red); }
      .statcard.s-over .n { color: var(--red); }
      .statcard.s-due { border-left-color: var(--amber); }
      .statcard.s-due .n { color: var(--amber); }
      .statcard.s-gigs { border-left-color: var(--brass); }
      .statcard.s-gigs .n { color: var(--brass-bright); }

      /* Contacts */
      .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
      .chip { font-size: 12.5px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
      .chip.on { border-color: var(--brass); color: var(--brass-bright); background: color-mix(in oklab, var(--brass) 12%, transparent); }
      .reldot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; vertical-align: middle; }
      .relrow { display: flex; gap: 7px; }
      .relchip { flex: 1; text-align: center; padding: 9px 4px; border-radius: 9px; border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
      .relchip.on { color: var(--ink-on-accent); font-weight: 700; border-color: transparent; }

      /* Collapsible, color-coded pipeline sections (--sec = the section's umbrella color) */
      .psection { margin-bottom: 12px; }
      .psection-head { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: color-mix(in oklab, var(--sec) 15%, var(--surface)); border: 1px solid color-mix(in oklab, var(--sec) 32%, var(--line)); }
      .psection-head:active { filter: brightness(1.1); }
      .psection-bar { width: 4px; height: 18px; border-radius: 2px; background: var(--sec); flex: none; }
      .psection-name { flex: 1; text-align: left; font-size: 13.5px; font-weight: 700; color: var(--parchment); letter-spacing: 0.02em; }
      .psection-count { font-size: 12px; font-weight: 700; color: var(--sec); background: color-mix(in oklab, var(--sec) 20%, transparent); border-radius: 999px; padding: 2px 9px; font-variant-numeric: tabular-nums; }
      .psection-chev { color: var(--muted); display: inline-flex; transform: rotate(90deg); transition: transform 0.15s; }
      .psection-chev.col { transform: rotate(0deg); }
      .psection-body { padding-top: 9px; }
      .card.accented { border-left: 3px solid var(--acc, var(--line-strong)); }
      /* One row per stage inside a pipeline section: the stage name, then its projects scrolling
         sideways. The strip bleeds to the screen edges (main has 14px side padding) so a card can
         slide all the way off; with more than one card each is 82% wide so the next one peeks in. */
      .prow { margin: 2px 0 14px; }
      .prow:last-child { margin-bottom: 4px; }
      .prow-head { display: flex; align-items: center; gap: 8px; margin: 0 4px 7px; }
      .prow-name { font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: 0.02em; }
      .prow-count { font-size: 11px; font-weight: 700; color: var(--sec); background: color-mix(in oklab, var(--sec) 16%, transparent); border-radius: 999px; padding: 1px 8px; font-variant-numeric: tabular-nums; }
      .prow-strip { display: flex; gap: 9px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; margin: 0 -14px; padding: 0 14px 2px; scroll-padding: 0 14px; scrollbar-width: none; }
      .prow-strip::-webkit-scrollbar { display: none; }
      .prow-strip::after { content: ''; flex: 0 0 5px; } /* Safari drops a scroller's end padding */
      .prow-strip > .card { flex: 0 0 82%; min-width: 0; margin-bottom: 0; scroll-snap-align: start; }
      .prow-one .prow-strip > .card { flex-basis: 100%; }
      .prow .card .pill { display: none; } /* the stage name is the row heading already */

      /* Login screen (Supabase Auth: email + password) */
      #login { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; padding: 24px; }
      #login .box { width: 100%; max-width: 320px; text-align: center; }
      #login h2 { font-size: 20px; margin: 0 0 4px; }
      #login p { color: var(--faint); font-size: 13px; margin: 0 0 22px; }
      #login input { width: 100%; font-size: 16px; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--parchment); margin-bottom: 10px; }
      #login input::placeholder { color: var(--faint); }
      #login .signinbtn { width: 100%; margin-top: 4px; padding: 13px; border-radius: 12px; background: var(--brass); color: var(--ink-on-accent); font-weight: 700; font-size: 15px; }
      #login .signinbtn:active { filter: brightness(1.1); }
      #login .signinbtn:disabled { opacity: 0.6; }
      #login .err { color: var(--red); font-size: 12.5px; margin-top: 12px; min-height: 16px; }
      .spinner { color: var(--faint); text-align: center; padding: 40px; font-size: 13px; }

      /* ============================================================================================
         THE BRAND GROUND (2026-10-23). Michael: "I want my phone app to look a lot more like" the Mac.
         This is the Mac's own approach (src/index.css, "THE BRAND GROUND"), ported: the header band and
         the page ground go navy, text sitting directly on the navy goes light, the accent goes GOLD on
         navy, and anything that paints a card resets every token to the light palette for its own
         subtree, so nothing inside a card had to change. Sheets, the drawer and the toast live outside
         #view and keep the light palette on their own.

         Same token names as the Mac (--parchment = body text, --brass = accent), same values.
         ============================================================================================ */
      :root { --font-display: 'Fraunces', Georgia, 'Times New Roman', serif; --navy: #16265a; }
      body { font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
      html, body { background: var(--navy); }
      /* A fixed layer rather than background-attachment: fixed, which iOS ignores. */
      body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
        background: linear-gradient(180deg, #18295f 0%, #0c1638 100%); }
      /* Home gets the Mac's lighter navy and the damask, the same as Home on the Mac. */
      body[data-page="home"]::before { background: url('./damask.webp') top left / 360px 360px repeat, linear-gradient(180deg, #2f4383 0%, #1e2f68 100%); }

      :is(header.topbar, #view, #login) {
        --parchment: #f4f5f7; --muted: #d3d5da; --faint: #b0b3bd;
        --line: rgba(255, 255, 255, 0.14); --line-strong: rgba(255, 255, 255, 0.26);
        --brass: #e3c279; --brass-bright: #f0d69b; --brass-dim: rgba(227, 194, 121, 0.72);
        --green: #6ee7a5; --amber: #f0b866; --red: #ff8a80; --teal: #7dd3e8; --violet: #c4b5fd;
        --ink-on-accent: #16265a;
        color: var(--parchment);
      }
      /* ⚠️ ANYTHING THAT PAINTS A SURFACE IS A CARD, AND A CARD IS STILL LIGHT. The list is every rule in
         this sheet that paints a light background. A new card class needs adding here, or its dark text
         inherits the light-on-navy palette and vanishes. */
      :is(header.topbar, #view, #login) :is(.card, .search, .btn-ghost, .seg, .msg, .addform, .field-input,
        .stagesel, .stat, .pagenote, .actrow, .phead, .dayof, .emailcard, .bk-gate, .pdfchip, .pdfframe,
        .statcard, .psection-head, .panel, .tabs, .fin-card, .fin-month, .cal-grid, .chartcard, .cal-grid, .pb-card, .box, input, select, textarea) {
        --bg: #eef0f3; --surface: #ffffff; --surface2: #f5f7f9; --surface3: #eaedf1;
        --parchment: #14171b; --muted: #545b64; --faint: #858d97;
        --line: rgba(15, 22, 32, 0.11); --line-strong: rgba(15, 22, 32, 0.18);
        --brass: #2563eb; --brass-bright: #1a4fd0; --brass-dim: #a9c2f6;
        --green: #15803d; --amber: #b45309; --red: #dc2626; --teal: #0e7490; --violet: #7c3aed;
        --ink-on-accent: #ffffff;
        color: var(--parchment);
      }
      /* Cards lift off the navy the way the Mac's do. Nested surfaces stay flat. */
      #view :is(.card, .stat, .statcard, .phead, .dayof, .emailcard, .panel, .fin-card, .chartcard, .pb-card, .box) { box-shadow: 0 14px 30px -18px rgba(4, 8, 24, 0.75); }
      #view :is(.card, .stat, .statcard, .phead, .dayof, .panel, .fin-card, .chartcard, .pb-card, .box) :is(.card, .stat, .statcard, .emailcard, .box) { box-shadow: none; }
      /* A filled gold button on navy needs navy text; inside a card the accent is blue again. */
      #view .btn-gold { color: var(--ink-on-accent); }

      /* The header band: navy, a hairline under it, a date line above a serif title. */
      header.topbar { background: linear-gradient(180deg, rgba(24, 41, 95, 0.97) 0%, rgba(22, 38, 90, 0.97) 100%);
        border-bottom: 1px solid rgba(255, 255, 255, 0.16); padding-bottom: 12px; }
      .hdr-eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.01em; color: var(--faint);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .hdr-eyebrow #updated:not(:empty) { color: var(--brass); }
      .hdr-eyebrow #hdr-date:not(:empty) + #updated:not(:empty)::before { content: '  ·  '; color: var(--faint); }
      .topbar-title h1 { font-family: var(--font-display); font-weight: 500; font-size: 24px; line-height: 1.12; letter-spacing: -0.01em; margin-top: 1px; }
      header.topbar .iconbtn { background: rgba(255, 255, 255, 0.10); border-color: rgba(255, 255, 255, 0.18); color: #e9ecf2; }
      header.topbar .iconbtn:active { background: rgba(255, 255, 255, 0.18); }
      header.topbar .backpill { background: rgba(255, 255, 255, 0.10); border-color: rgba(255, 255, 255, 0.18); }

      /* Serif for the big numbers, as on the Mac. */
      .statcard .n, .stat .big { font-family: var(--font-display); font-weight: 500; letter-spacing: -0.01em; }
      .section-label { color: var(--brass); }

      /* The project tab bar is navy too, so the screen is framed top and bottom in the same colour. */
      #ptabs { background: rgba(14, 24, 60, 0.94); border-top-color: rgba(255, 255, 255, 0.14); }
      #ptabs .ptab { color: #b0b3bd; }
      #ptabs .ptab.on { color: #f0d69b; }

      /* The login screen wears the ground too. */
      #login { background: transparent; }

      /* The drawer, dressed as the Mac sidebar. */
      .drawer-panel { background: #f5f7f9; }
      .drawer-brand { display: flex; align-items: center; gap: 10px; padding: 4px 16px 14px; border-bottom: none; }
      .db-mark { flex: none; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line-strong); background: #fff;
        display: grid; place-items: center; font-family: var(--font-display); font-style: italic; font-size: 22px; color: #2563eb; }
      .db-text { display: flex; flex-direction: column; min-width: 0; }
      .db-name { font-family: var(--font-display); font-size: 17px; font-weight: 500; color: var(--parchment); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .db-sub { font-size: 11.5px; letter-spacing: 0.01em; color: var(--faint); }
      .drawer-search { display: flex; align-items: center; gap: 9px; margin: 0 12px 6px; padding: 10px 12px; border-radius: 10px;
        border: 1px solid var(--line-strong); background: #fff; color: var(--faint); font-size: 14.5px; text-align: left; }
      .drawer-group { font-size: 12px; font-weight: 600; letter-spacing: 0.01em; color: var(--faint); padding: 14px 14px 4px; }
      .drawer-group:first-child { padding-top: 4px; }
      .drawer-nav { gap: 1px; padding-top: 4px; }
      .drawer-nav button { padding: 10px 14px; color: #3a414a; }
      .drawer-nav button svg { width: 19px; height: 19px; }
      .drawer-nav button.on { background: #e6ebf3; color: #1a4fd0; }
      .drawer-nav button.on svg { color: #2563eb; }

      /* ---- Playbook (mirrors the Mac's PlaybookPage) ---- */
      .pb-card { background: var(--surface2); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
      .pb-h { font-family: var(--font-display); font-weight: 500; font-size: 19px; margin: 0; color: var(--parchment); }
      .pb-h1 { font-size: 21px; }
      .pb-blurb { font-size: 13.5px; line-height: 1.55; color: var(--muted); margin: 6px 0 12px; }
      .pb-quote { border-left: 2px solid var(--brass-dim); padding-left: 12px; font-style: italic; font-size: 13.5px; line-height: 1.55; margin: 10px 0 6px; }
      .pb-src { font-size: 12px; color: var(--faint); margin: 0; line-height: 1.5; }
      .pb-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
      .pb-tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 13px; }
      .pb-tile b { display: block; font-size: 14px; }
      .pb-tile p { margin: 5px 0 0; font-size: 13px; line-height: 1.55; color: var(--muted); }
      .pb-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11.5px; color: var(--muted); margin-bottom: 12px; }
      .pb-legend span { display: inline-flex; align-items: center; gap: 6px; }
      .pb-legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
      .pb-legend i.pb-legend-cal { width: 20px; height: 12px; border-radius: 4px; background: color-mix(in oklab, #2563eb 10%, #fff); border: 1px solid color-mix(in oklab, #2563eb 32%, var(--line)); }
      .pb-legend-note { color: var(--faint); }
      .pb-scroll { overflow-x: auto; margin: 0 -16px; padding: 0 12px 6px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
      .pb-scroll::-webkit-scrollbar { display: none; }
      .pb-track { display: flex; min-width: max-content; }
      .pb-col { width: 214px; flex: none; padding: 0 5px; display: flex; flex-direction: column; }
      .pb-above { min-height: 104px; display: flex; flex-direction: column; justify-content: flex-end; }
      .pb-below { min-height: 112px; }
      .pb-blk { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 10px 11px; }
      .pb-blk.pb-cal { background: color-mix(in oklab, #2563eb 10%, #fff); border-color: color-mix(in oklab, #2563eb 32%, var(--line)); }
      .pb-bh { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
      .pb-bh b { font-size: 13px; line-height: 1.3; }
      .pb-blk p { margin: 4px 0 0; font-size: 11.5px; line-height: 1.45; color: var(--muted); }
      .pb-blk p.pb-calnote { color: #2563eb; font-weight: 600; font-size: 10.5px; }
      .pb-pill { flex: none; border: 1px solid; border-radius: 999px; padding: 0 6px; font-size: 9.5px; font-weight: 600; line-height: 1.6; }
      .pb-rail { position: relative; margin: 8px -5px; border-top: 2px solid var(--line-strong); padding: 10px 5px 0; text-align: center; }
      .pb-dot { position: absolute; top: -7px; left: 50%; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; border: 2px solid var(--surface2); }
      .pb-when { font-size: 11.5px; font-weight: 600; letter-spacing: 0.1em; color: var(--faint); }

      /* ---- Finance (mirrors the Mac's FinancePage) ---- */
      .fin-tabs { display: flex; overflow-x: auto; margin-bottom: 14px; scrollbar-width: none; }
      .fin-tabs::-webkit-scrollbar { display: none; }
      .fin-tabs .segb { flex: 1 0 auto; }
      .fin-intro { font-size: 12.5px; line-height: 1.5; color: var(--muted); margin: 0 2px 12px; }
      .fin-intro b { color: var(--parchment); font-weight: 600; }
      .fin-ctrl { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 2px 14px; }
      .fin-check { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
      .fin-check input { width: 17px; height: 17px; accent-color: #e3c279; }
      .fin-basis { margin: 0; }
      .fin-card { background: var(--surface2); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
      .fin-cap { font-size: 12px; font-weight: 600; letter-spacing: 0.01em; color: var(--faint); margin-bottom: 8px; }
      .fin-caprow { display: flex; align-items: center; gap: 8px; }
      .fin-caprow > span:first-child { flex: 1; }
      .fin-asof { font-size: 11px; letter-spacing: 0; text-transform: none; font-weight: 400; }
      .fin-fig { display: block; width: 100%; text-align: left; padding: 4px; margin: -4px; border-radius: 10px; }
      .fin-fig:active { background: var(--surface3); }
      .fin-l { font-size: 12px; font-weight: 600; letter-spacing: 0.01em; color: var(--faint); }
      .fin-n { font-family: var(--font-display); font-size: 30px; line-height: 1.05; color: var(--brass); font-variant-numeric: tabular-nums; margin-top: 3px; }
      .fin-n2 { font-family: var(--font-display); font-size: 22px; line-height: 1.1; color: var(--green); font-variant-numeric: tabular-nums; margin-top: 3px; }
      .fin-h { font-size: 11.5px; color: var(--faint); line-height: 1.4; margin-top: 3px; }
      .fin-net { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; }
      .fin-sec { display: flex; align-items: center; gap: 10px; margin: 20px 2px 10px; font-size: 13px; font-weight: 600; letter-spacing: 0.2em; color: var(--brass); }
      .fin-sec > span:first-child { flex: none; }
      .fin-sec-r { margin-left: auto; letter-spacing: 0.02em; text-transform: none; color: var(--muted); font-weight: 500; }
      .fin-edit { font-size: 11.5px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 7px; padding: 3px 9px; }
      .fin-goal-link { margin-left: auto; font-size: 11.5px; letter-spacing: 0; text-transform: none; font-weight: 500; color: var(--faint); text-decoration: underline; text-underline-offset: 3px; }
      .fin-monthly-edit { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; letter-spacing: 0; text-transform: none; color: var(--faint); font-weight: 500; }
      .fin-monthly-edit input { width: 90px; padding: 5px 8px; font-size: 13px; }
      .fin-goals { display: flex; flex-direction: column; gap: 12px; margin: 0 2px; }
      .goal-top { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; margin-bottom: 5px; color: var(--muted); }
      .goal-top b { color: var(--parchment); }
      .goal-bar { height: 10px; border-radius: 99px; background: rgba(255, 255, 255, 0.16); overflow: hidden; }
      .goal-bar span { display: block; height: 100%; background: linear-gradient(90deg, #4f7cf0, #2563eb); border-radius: 99px; }
      .fin-foot { font-size: 11.5px; color: var(--faint); margin: 8px 2px 0; line-height: 1.45; }
      .fin-goaledit .goal-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; color: var(--muted); }
      .fin-goaledit .goal-row input { flex: 1; }
      .linkbtn { color: var(--brass-bright); font-size: 13px; font-weight: 600; padding: 4px 0; }
      .faint { color: var(--faint); }
      .fin-months { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .fin-month { position: relative; overflow: hidden; text-align: left; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2);
        --parchment: #14171b; --faint: #858d97; color: #14171b; }
      .fin-fill { position: absolute; left: 0; right: 0; bottom: 0; background: color-mix(in oklab, #15803d 28%, transparent); }
      .fin-ml { position: relative; display: block; font-size: 11.5px; letter-spacing: 0.01em; color: #858d97; }
      .fin-mv { position: relative; display: block; font-family: var(--font-display); font-size: 17px; margin-top: 3px; font-variant-numeric: tabular-nums; }
      .fin-bank .acct { padding: 10px 0; border-top: 1px solid var(--line); }
      .fin-bank .acct:first-child { border-top: none; padding-top: 2px; }
      .acct-n { font-size: 12.5px; font-weight: 600; }
      .acct-v { font-family: var(--font-display); font-size: 26px; color: var(--brass); margin-top: 2px; font-variant-numeric: tabular-nums; }
      .fin-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .fin-pair .fin-card { margin-bottom: 12px; }
      .fin-pair .fin-n { font-size: 24px; }
      .fin-form label { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.01em; color: var(--faint); margin-bottom: 8px; }
      .fin-form label .field-input { margin-top: 4px; text-transform: none; letter-spacing: normal; font-weight: 400; }
      .ff-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .fin-list { padding: 4px 12px; }
      .fl-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
      .fl-row:first-child { border-top: none; }
      .fl-main { flex: 1; min-width: 0; }
      .fl-top { display: flex; justify-content: space-between; gap: 10px; }
      .fl-name { font-weight: 600; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .fl-amt { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--brass-bright); flex: none; }
      .fl-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 3px; }
      .fl-meta .pill { margin: 0; font-size: 10.5px; }
      .bd-list { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
      .bd-row { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; font-size: 14px; }
      .bd-row:nth-child(even) { background: var(--surface2); }
      .bd-link .bd-name { color: var(--brass-bright); }
      .bd-amt { font-variant-numeric: tabular-nums; font-weight: 600; flex: none; }
      .bd-foot { display: flex; justify-content: space-between; padding: 12px 4px 0; font-size: 13px; color: var(--muted); }

      /* ---- Calendar ---- */
      .cal-head { display: flex; align-items: center; gap: 8px; margin: 2px 2px 10px; }
      .cal-title { flex: 1; text-align: center; font-family: var(--font-display); font-size: 22px; }
      .cal-head .iconbtn { background: rgba(255,255,255,0.10); color: #e9ecf2; }
      .cal-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--muted); margin: 0 2px 10px; }
      .cal-legend span { display: inline-flex; align-items: center; gap: 5px; }
      .cal-legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
      .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); background: #fff; border-radius: 16px; padding: 6px; gap: 2px; }
      .cal-wd { text-align: center; font-size: 10.5px; font-weight: 700; color: #858d97; padding: 4px 0 6px; letter-spacing: 0.01em; }
      .cal-day { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 7px; border-radius: 10px; min-height: 48px; color: #14171b; }
      .cal-day.out { color: #b9bfc7; }
      .cal-day.sel { background: #eaf0fd; }
      .cal-n { font-size: 14.5px; font-weight: 600; width: 26px; height: 26px; line-height: 26px; border-radius: 50%; text-align: center; font-variant-numeric: tabular-nums; }
      .cal-day.today .cal-n { background: #2563eb; color: #fff; }
      .cal-dots { display: flex; gap: 2px; align-items: center; min-height: 6px; }
      .cal-dots i { width: 6px; height: 6px; border-radius: 50%; display: block; }
      .cal-dots b { font-size: 9px; line-height: 6px; color: #858d97; }
      .cal-item { gap: 10px; }
      .cal-bar { width: 4px; align-self: stretch; border-radius: 2px; flex: none; }
      .cal-time { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }

      /* ---- Stats ---- */
      .stats-seg { display: flex; overflow-x: auto; margin-bottom: 10px; scrollbar-width: none; }
      .stats-seg::-webkit-scrollbar { display: none; }
      .stats-seg .segb { flex: 1 0 auto; white-space: nowrap; }
      .fin-ctrl .stats-seg { margin-bottom: 0; flex: 1; }
      .fin-edit.on { color: var(--brass); border-color: var(--brass-dim); }
      .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 12px; }
      .sbars { display: flex; flex-direction: column; gap: 10px; }
      .sbar-top { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 4px; }
      .sbar-top span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
      .sbar-top i { font-style: normal; color: var(--faint); }
      .sbar-track { height: 8px; border-radius: 99px; background: var(--surface3); overflow: hidden; }
      .sbar-track span { display: block; height: 100%; border-radius: 99px; }
      .mbars { display: flex; align-items: flex-end; gap: 6px; height: 160px; overflow-x: auto; padding-bottom: 2px; }
      .mbar { flex: 1 0 34px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; height: 100%; }
      .mbar-n { font-size: 10px; color: var(--muted); }
      .mbar-b { width: 100%; background: #2563eb; border-radius: 4px 4px 0 0; min-height: 4px; }
      .mbar-l { font-size: 9px; color: var(--faint); white-space: nowrap; }
      .audit { padding: 12px; }
      .audit.signed { opacity: 0.6; }
      .audit-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
      .audit-name { font-weight: 600; font-size: 14px; text-align: left; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .audit-sign { flex: none; font-size: 12px; font-weight: 600; border: 1px solid var(--brass-dim); color: var(--brass-bright); border-radius: 8px; padding: 5px 10px; }
      .audit.signed .audit-sign { border-color: transparent; background: color-mix(in oklab, var(--green) 18%, transparent); color: var(--green); }
      .audit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .audit-f span { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; color: var(--faint); margin-bottom: 3px; }
      .audit-f .field-input { padding: 7px 8px; font-size: 13px; }
      .f-empty { border-color: #ef4444 !important; background: rgba(239, 68, 68, 0.10) !important; }
      .f-warn { border-color: #eab308 !important; background: rgba(234, 179, 8, 0.12) !important; }

      /* ---- Website ---- */
      .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #6ee7a5; margin-right: 4px; box-shadow: 0 0 0 3px rgba(110, 231, 165, 0.25); }
      .kv4 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .kv4 > div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; }

          </button>
          <button class="iconbtn" id="refresh" aria-label="Refresh">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          </button>
        </div>
      </header>
      <main id="view"><div class="spinner">Loading…</div></main>
    </div>

    <div id="drawer" class="hidden">
      <div class="drawer-backdrop" id="drawer-backdrop"></div>
      <aside class="drawer-panel">

        <nav class="drawer-nav" id="drawer-nav">
          <div class="drawer-group">Workspace</div>

          <button data-page="inbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h5l2 3h4l2-3h5"/><path d="M5 5h14l2 7v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5z"/></svg><span class="dn-l">Inbox</span><span class="navbadge hidden" id="nav-badge-inbox"></span></button>

          <button data-page="alerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="dn-l">Alerts</span><span class="navbadge hidden" id="nav-badge-alerts"></span></button>
          <button data-page="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/></svg><span class="dn-l">Calendar</span></button>
          <button data-page="finance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 3 3 7-7"/><path d="M16 8h4v4"/></svg><span class="dn-l">Finance</span></button>
          <button data-page="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="dn-l">Stats</span></button>
          <button data-page="website"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.6 2.6 15.4 0 18M12 3c-2.6 2.6-2.6 15.4 0 18"/></svg><span class="dn-l">Website</span></button>
          <button data-page="contacts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 5.2a3 3 0 0 1 0 5.6M17.5 20a5.5 5.5 0 0 0-2.7-4.7"/></svg><span class="dn-l">Contacts</span></button>

          <button data-page="shows"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8-4.3-4.1 5.9-.9z"/></svg><span class="dn-l">Shows</span></button>
          <button data-page="playbook"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H18a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5.5A1.5 1.5 0 0 1 4 17.5z"/><path d="M4 17.5A1.5 1.5 0 0 1 5.5 16H19"/><path d="M8 8h7M8 11h5"/></svg><span class="dn-l">Playbook</span></button>

          <div class="drawer-group">System</div>
          <button data-page="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="dn-l">Settings</span></button>
        </nav>
        <div class="drawer-foot">
          <button id="drawer-logout">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            Log out

        </div>
      </aside>
    </div>

    <script type="module" src="./app.js"></script>
