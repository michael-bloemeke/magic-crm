<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- This is a private, per-client page. Never index it. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Michael Bloemeke</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #14110b;
        --bg-2: #1a1610;
        --card: #211c14;
        --card-2: #262017;
        --ink: #f2ecdf;
        --muted: #b8ad97;
        --faint: #8c826f;
        --line: rgba(214, 193, 150, 0.14);
        --line-strong: rgba(214, 193, 150, 0.26);
        --brass: #c79a4b;
        --brass-bright: #e6c074;
        --brass-soft: rgba(199, 154, 75, 0.13);
      }
      * { box-sizing: border-box; }
      html { background: var(--bg); }
      body {
        margin: 0;
        color: var(--ink);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        line-height: 1.55;
        background:
          radial-gradient(1100px 520px at 50% -10%, rgba(199, 154, 75, 0.12), transparent 60%),
          var(--bg);
        min-height: 100vh;
      }
      .wrap { max-width: 780px; margin: 0 auto; padding: 64px 24px 84px; }
      .hero { text-align: center; margin-bottom: 26px; }
      .brand {
        margin: 0 0 16px;
        font-size: 10.5px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--brass-bright);
        font-weight: 600;
      }
      h1 {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 600;
        font-size: clamp(34px, 6.5vw, 52px);
        line-height: 1.04;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .etype {
        margin: 14px 0 0;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .rule { width: 54px; height: 2px; margin: 22px auto 0; background: linear-gradient(90deg, transparent, var(--brass), transparent); }
      .card {
        background: linear-gradient(180deg, var(--card-2), var(--card));
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 22px 24px;
        margin-top: 16px;
        box-shadow: 0 24px 60px -44px rgba(0, 0, 0, 0.9);
      }
      .card h2 {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--brass-bright);
        margin: 0 0 16px;
      }
      .message { font-size: 16.5px; line-height: 1.7; color: var(--ink); white-space: pre-line; }
      /* Event facts: two columns to keep it from running long. */
      .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 28px; }
      @media (max-width: 520px) { .facts { grid-template-columns: 1fr; } }
      .fact { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
      .fact .lbl { color: var(--faint); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
      .fact .val { color: var(--ink); font-size: 15px; font-weight: 500; word-break: break-word; }
      .files { display: flex; flex-direction: column; gap: 8px; }
      .file {
        display: flex; align-items: center; justify-content: space-between; gap: 14px;
        border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--bg-2);
      }
      .file .fname { font-size: 14px; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .file .facts-actions { display: flex; gap: 8px; shrink: 0; }
      .links { display: flex; flex-wrap: wrap; gap: 10px; }
      .btn {
        display: inline-block; padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 600;
        text-decoration: none; cursor: pointer; border: 1px solid var(--brass); color: var(--brass-bright);
        background: var(--brass-soft); transition: background 0.15s, color 0.15s, border-color 0.15s;
      }
      .btn:hover { background: var(--brass); color: #1a1407; }
      .btn-sm { padding: 7px 13px; font-size: 12px; }
      .btn-solid { background: var(--brass); color: #1a1407; border-color: var(--brass); }
      .btn-solid:hover { filter: brightness(1.07); }
      .btn-ghost { background: transparent; border-color: var(--line-strong); color: var(--muted); }
      .btn-ghost:hover { border-color: var(--brass); color: var(--brass-bright); background: transparent; }
      footer { margin-top: 30px; text-align: center; color: var(--faint); font-size: 12.5px; }
      /* Questionnaire form */
      .qform { display: flex; flex-direction: column; gap: 18px; }
      .qfield { display: flex; flex-direction: column; gap: 7px; }
      .qfield label { font-size: 13.5px; font-weight: 500; color: var(--ink); }
      .qfield .req { color: var(--brass-bright); }
      .qfield input, .qfield textarea, .qfield select {
        font-family: inherit; font-size: 15px; color: var(--ink); background: var(--bg-2);
        border: 1px solid var(--line-strong); border-radius: 11px; padding: 12px 14px;
        width: 100%; outline: none; transition: border-color 0.15s, box-shadow 0.15s;
      }
      .qfield input::placeholder, .qfield textarea::placeholder { color: var(--faint); }
      .qfield input:focus, .qfield textarea:focus, .qfield select:focus {
        border-color: var(--brass); box-shadow: 0 0 0 3px var(--brass-soft);
      }
      .qfield textarea { resize: vertical; min-height: 90px; }
      .qfield select option { background: var(--card); color: var(--ink); }
      .qsubmit {
        align-self: flex-start; margin-top: 4px; border: 0; cursor: pointer;
        background: var(--brass); color: #1a1407; font-family: inherit; font-weight: 600;
        font-size: 15px; padding: 13px 30px; border-radius: 999px; transition: filter 0.15s;
      }
      .qsubmit:hover { filter: brightness(1.07); }
      .qsubmit:disabled { opacity: 0.55; cursor: default; }
      .qnote { font-size: 13px; color: var(--muted); margin: 0; }
      .qerror { color: #e89a7c; }
      .qhp { position: absolute !important; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
      .thanks { text-align: center; padding: 14px 4px; }
      .thanks h2 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 26px; color: var(--ink); margin: 0 0 10px; text-transform: none; letter-spacing: 0; }
      .thanks p { color: var(--muted); margin: 0 auto; max-width: 30rem; font-size: 15px; }
      .thanks .btn { margin-top: 22px; }
      .center { text-align: center; }
      .center h1 { font-size: clamp(26px, 5vw, 34px); }
      .center p { color: var(--muted); margin: 14px auto 0; max-width: 30rem; }
      .loading { padding: 96px 0; text-align: center; color: var(--faint); }
    </style>
  </head>
  <body>
    <main id="app"><div class="loading">Loading…</div></main>
    <script>
      const app = document.getElementById('app')
      const token = location.pathname.replace(/^\/p\//, '').replace(/\/+$/, '').trim()

      const esc = (s) =>
        String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
      const LINK_LABELS = { video: 'Promo video', reviews: 'Reviews', intro: 'Intro video', site: 'Website' }

      function invalid() {
        app.innerHTML =
          '<div class="wrap"><div class="card center"><p class="brand">Michael Bloemeke</p>' +
          '<h1>This link isn’t available</h1>' +
          '<p>It may have expired or been turned off. Please reach out to Michael for an updated link.</p></div></div>'
      }

      function hero(b) {
        return (
          '<header class="hero"><p class="brand">The Award-Winning Magic of Michael Bloemeke</p>' +
          '<h1>' + esc(b.projectName || 'Your Event') + '</h1>' +
          (b.eventType ? '<p class="etype">' + esc(b.eventType) + '</p>' : '') +
          '<div class="rule"></div></header>'
        )
      }

      // One form control for a question, by type.
      function qControl(q) {
        const name = 'q_' + esc(q.id)
        const req = q.required ? ' required' : ''
        if (q.type === 'textarea') return '<textarea id="' + name + '" name="' + name + '"' + req + '></textarea>'
        if (q.type === 'select') {
          const opts = ['<option value="">Select…</option>']
            .concat((q.options || []).map((o) => '<option value="' + esc(o) + '">' + esc(o) + '</option>'))
            .join('')
          return '<select id="' + name + '" name="' + name + '"' + req + '>' + opts + '</select>'
        }
        const t = q.type === 'date' ? 'date' : q.type === 'tel' ? 'tel' : q.type === 'number' ? 'number' : 'text'
        return '<input type="' + t + '" id="' + name + '" name="' + name + '"' + req + ' />'
      }

      // The questionnaire GATE: a full page the client completes once before the portal opens.
      function renderGate(b) {
        const qn = b.questionnaire
        const fields = (qn.questions || [])
          .map(
            (q) =>
              '<div class="qfield"><label for="q_' + esc(q.id) + '">' + esc(q.label) +
              (q.required ? ' <span class="req">*</span>' : '') + '</label>' + qControl(q) + '</div>',
          )
          .join('')
        app.innerHTML =
          '<div class="wrap">' +
          hero(b) +
          '<section class="card">' +
          '<h2>A few details about your event</h2>' +
          (qn.intro ? '<p class="message" style="margin-bottom:20px">' + esc(qn.intro) + '</p>' : '') +
          '<form id="qform" class="qform" novalidate>' +
          '<input class="qhp" tabindex="-1" autocomplete="off" aria-hidden="true" id="q_hp" />' +
          fields +
          '<p class="qnote" id="qmsg"></p>' +
          '<button type="submit" class="qsubmit" id="qbtn">Send to Michael</button>' +
          '</form></section>' +
          '<footer>Questions? Just reply to Michael’s email.</footer>' +
          '</div>'
        wireGate(b)
      }

      // Collect answers, POST them, then show a thank-you page. The submission is stored server-side,
      // so a refresh or a return visit goes straight to the portal (the questionnaire is one-time).
      function wireGate(b) {
        const qn = b.questionnaire
        const form = document.getElementById('qform')
        if (!form) return
        form.addEventListener('submit', function (e) {
          e.preventDefault()
          const btn = document.getElementById('qbtn')
          const msg = document.getElementById('qmsg')
          msg.className = 'qnote'
          msg.textContent = ''
          for (const q of qn.questions) {
            if (!q.required) continue
            const el = document.getElementById('q_' + q.id)
            if (el && !String(el.value || '').trim()) {
              msg.className = 'qnote qerror'
              msg.textContent = 'Please answer: ' + q.label
              el.focus()
              return
            }
          }
          const answers = qn.questions
            .map((q) => {
              const el = document.getElementById('q_' + q.id)
              return { id: q.id, label: q.label, value: el ? String(el.value || '') : '' }
            })
            .filter((a) => a.value.trim() !== '')
          const hp = document.getElementById('q_hp')
          btn.disabled = true
          btn.textContent = 'Sending…'
          fetch('/api/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token, answers: answers, _hp: hp ? hp.value : '' }),
          })
            .then((r) => (r.ok ? r.json() : r.json().then((d) => Promise.reject(new Error(d.error || 'failed')))))
            .then(() => {
              renderThankYou(b)
            })
            .catch((err) => {
              msg.className = 'qnote qerror'
              msg.textContent = 'Sorry, that didn’t send. Please try again. (' + (err && err.message ? err.message : 'error') + ')'
              btn.disabled = false
              btn.textContent = 'Send to Michael'
            })
        })
      }

      // Shown immediately after a successful submission: a clean confirmation, with a button to view
      // the event page when ready (a refresh later opens it directly).
      function renderThankYou(b) {
        app.innerHTML =
          '<div class="wrap">' +
          hero(b) +
          '<section class="card"><div class="thanks">' +
          '<h2>Thank you!</h2>' +
          '<p>Your details are on their way to Michael. He’ll be in touch if he needs anything else.</p>' +
          '<button type="button" class="btn" id="toPortal">View your event page</button>' +
          '</div></section>' +
          '<footer>Questions? Just reply to Michael’s email.</footer>' +
          '</div>'
        const toPortal = document.getElementById('toPortal')
        if (toPortal) toPortal.addEventListener('click', () => renderPortal(b, false))
      }

      // The portal proper: curated event details, message, files, and links. No questionnaire here.
      function renderPortal(b, justSubmitted) {
        const facts = (b.fields || [])
          .map((f) => '<div class="fact"><span class="lbl">' + esc(f.label) + '</span><span class="val">' + esc(f.value) + '</span></div>')
          .join('')
        const files = (b.files || [])
          .filter((f) => f && f.url)
          .map(
            (f) =>
              '<div class="file"><span class="fname">' + esc(f.name || 'File') + '</span>' +
              '<span class="facts-actions">' +
              '<a class="btn btn-sm btn-ghost" href="' + esc(f.url) + '" target="_blank" rel="noopener noreferrer">Preview</a>' +
              '<a class="btn btn-sm btn-ghost" href="' + esc(f.url) + '" download>Download</a>' +
              '</span></div>',
          )
          .join('')
        const links = Object.entries(b.links || {})
          .filter(([, v]) => v)
          .map(
            ([k, v]) =>
              '<a class="btn btn-sm btn-ghost" href="' + esc(v) + '" target="_blank" rel="noopener noreferrer">' + esc(LINK_LABELS[k] || k) + '</a>',
          )
          .join('')
        app.innerHTML =
          '<div class="wrap">' +
          hero(b) +
          (justSubmitted
            ? '<section class="card"><div class="thanks"><h2>Thank you!</h2>' +
              '<p>Your details are in. Here is everything for your event.</p></div></section>'
            : '') +
          (b.message ? '<section class="card"><p class="message">' + esc(b.message) + '</p></section>' : '') +
          (facts ? '<section class="card"><h2>Event details</h2><div class="facts">' + facts + '</div></section>' : '') +
          (files ? '<section class="card"><h2>Files</h2><div class="files">' + files + '</div></section>' : '') +
          (links ? '<section class="card"><h2>Links</h2><div class="links">' + links + '</div></section>' : '') +
          '<footer>Questions? Just reply to Michael’s email.</footer>' +
          '</div>'
      }

      // Decide what to show. If a questionnaire is active, it GATES the portal until the client has
      // submitted it (checked server-side, so it is one-time and survives refreshes/return visits).
      function boot(b) {
        if (b.questionnaire && b.questionnaire.enabled) {
          fetch('/api/status?token=' + encodeURIComponent(token), { cache: 'no-store' })
            .then((r) => (r.ok ? r.json() : { submitted: false }))
            .then((s) => {
              if (s && s.submitted) renderPortal(b, false)
              else renderGate(b)
            })
            .catch(() => renderGate(b))
        } else {
          renderPortal(b, false)
        }
      }

      if (!token) {
        invalid()
      } else {
        fetch('/data/' + encodeURIComponent(token) + '.json', { cache: 'no-store' })
          .then((r) => (r.ok ? r.json() : Promise.reject(new Error('not found'))))
          .then(boot)
          .catch(invalid)
      }
    </script>
  </body>
</html>
